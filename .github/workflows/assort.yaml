name: 'assort'

on:
  workflow_dispatch:
  push:
    branches:
      - 'love'
    paths:
      - '.github/workflows/assort.yaml'
      - '.site/package-lock.json'
      - '.squarkdown/'
      - '.assets/'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '.site/'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUPPETY_PAT }}

      - name: 'Setup Node'
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: '.site/package-lock.json'

      - name: '› npm audit'
        run: |
          npm audit --audit-level=moderate

      - name: '› npm ci'
        run: |
          npm ci

      # - name: '› npm run buildx'
      #   run: |
      #     npm run buildx

      - name: '› npm run prepx'
        run: |
          npm run prepx

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: 'svx'
          path: '.site/src/routes/**/*.svx'

      - name: '› npm run build'
        run: |
          npm run build

      - name: 'Upload Artifact'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 'Deploy'
        id: deployment
        uses: actions/deploy-pages@v5
