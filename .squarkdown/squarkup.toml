#:schema https://sup2point0.github.io/stranger-quarkdown/schemas/v4.8

[project]
name = 'Assort'
github = 'Sup2point0/Assort'

[errors]
strict = true
on-error = 'warn'
file-already-exists = 'overwrite'
link-broken = 'mark-dead'
link-inactive = 'mark-dead'

[paths]
site = '.site/'
sources = []  # entire repo
exclude = [
	'.archive/',
	'.assets/',
	'.github/',
	'.site/',
	'Antarctica/',
	'Victory/',
]

[charm]
flags = [
	"feat", "index",
	"dev", "depr", "archive",
	"deep", "woozy",
]
fields = [
	"font",
]

[out]
folder = 'src/routes/(back)/(dyna)'
site-data-path = 'src/data/site.json'
shorter-fields = false

[format]
inject-head = false
externalise-links = true
repair-html = true

[assets]
base-path = "/Assort/"
folder = '.assets/'
site-assets-folder = '.assets/.site/'

[fonts]
queries = [
	'Fira+Mono:wght@400;500;700',
	'Lora:ital,wght@0,400..700;1,400..700',
	'Nanum+Pen+Script',
	'Noto+Serif:ital,wght@0,100..900;1,100..900',
	'Outfit:wght@100..900',
	'ZCOOL+XiaoWei',
]
